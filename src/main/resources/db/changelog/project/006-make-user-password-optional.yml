databaseChangeLog:
  - changeSet:
      id: 006-make-user-password-optional
      author: developer-1
      comment: users can register by nickname only; the web client has no password authentication
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(255)
      rollback:
        - addNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(255)
